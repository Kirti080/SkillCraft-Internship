<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillCraft To-Do App</title>
  <link rel="stylesheet" href="task4_style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">📝 SkillCraft To-Do</div>
  </nav>

  <div class="container">
    <h2>Manage Your Tasks 🧠</h2>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Task Title..." required>
      <input type="datetime-local" id="taskDate" required>
      <button type="submit">Add Task ➕</button>
    </form>

    <ul id="taskList"></ul>
  </div>

  <script src="task4_script.js"></script>
</body>
</html>
